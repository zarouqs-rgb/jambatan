<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1419;color:#e6e9ee;font-family:system-ui,sans-serif;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.w{width:min(100%,440px)}
canvas{width:100%;height:auto;border-radius:12px;background:#000;display:block}
.row{display:flex;gap:8px}
button{flex:1;padding:14px 8px;border:0;border-radius:10px;font-size:15px;font-weight:600;background:#2a3440;color:#e6e9ee}
button.p{background:#3b82f6;color:#fff}
button:disabled{opacity:.5}
#st{font-size:13px;color:#9fb0c2;min-height:18px;text-align:center}
#st.err{color:#ff8a8a}
details{background:#1a2129;border:1px solid #2a3440;border-radius:12px;padding:10px}
summary{cursor:pointer;font-weight:600}
label{display:block;font-size:12px;color:#9fb0c2;margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #2f3b48;background:#10161c;color:#e6e9ee;font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
video{width:100%;border-radius:12px;background:#000}
a.dl{display:none;text-align:center;padding:14px;border-radius:10px;background:#16a34a;color:#fff;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="w"><canvas id="cv"></canvas></div>
<div class="w" id="st"></div>

<div class="w row">
  <button id="load">Muat Adegan &amp; Skrip</button>
  <button id="voice" class="p">Jana Suara</button>
</div>
<div class="w row">
  <button id="play">Main</button>
  <button id="rec" class="p">Rakam &amp; Simpan</button>
</div>

<details class="w" id="tsw" style="display:none" open>
  <summary>Stempel masa (boleh disalin)</summary>
  <textarea id="ts" readonly style="min-height:150px"></textarea>
  <button id="cpts" class="p" style="margin-top:8px">Salin Stempel Masa</button>
</details>

<details class="w">
  <summary>Skrip suara</summary>
  <label>Teks yang akan dibaca</label>
  <textarea id="script"></textarea>
</details>

<details class="w">
  <summary>Tetapan</summary>
  <label>Kunci API Gemini (kosongkan jika dalam Canvas)</label>
  <input id="gkey" type="password" autocomplete="off">
  <div class="row">
    <div style="flex:1"><label>Model suara</label><input id="tmodel"></div>
    <div style="flex:1"><label>Nama suara</label><select id="vname"><option>Kore</option><option>Zephyr</option><option>Puck</option><option>Charon</option><option>Fenrir</option><option>Leda</option><option>Orus</option><option>Aoede</option><option>Callirrhoe</option><option>Autonoe</option><option>Enceladus</option><option>Iapetus</option><option>Umbriel</option><option>Algieba</option><option>Despina</option><option>Erinome</option><option>Algenib</option><option>Rasalgethi</option><option>Laomedeia</option><option>Achernar</option><option>Alnilam</option><option>Schedar</option><option>Gacrux</option><option>Pulcherrima</option><option>Achird</option><option>Zubenelgenubi</option><option>Vindemiatrix</option><option>Sadachbia</option><option>Sadaltager</option><option>Sulafat</option></select></div>
  </div>
  <label>Gaya suara (arahan loghat dan nada)</label>
  <input id="style">
  <label>Repo GitHub (jika dibuka di luar halaman repo)</label>
  <input id="repo">
  <label>Cabang</label>
  <input id="branch">
</details>

<video id="pv" class="w" controls playsinline style="display:none"></video>
<a id="dl" class="w dl"></a>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const S = {g(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const D = {tmodel:'gemini-2.5-flash-preview-tts', vname:'Kore', style:'Say in a clear, friendly narrator tone with a Malaysian Malay accent (Bahasa Melayu Malaysia, not Indonesian pronunciation)', repo:'zarouqs-rgb/jambatan', branch:'main'};
['gkey','tmodel','vname','style','repo','branch'].forEach(k=>{
  const el=$(k); el.value=S.g('sv_'+k)||D[k]||'';
  el.addEventListener('input',()=>S.s('sv_'+k,el.value.trim()));
});
const st=(m,e)=>{$('st').textContent=m;$('st').className='w'+(e?' err':'');$('st').id='st'};

let cues=null, cueLines=[], V=null, ac=null, abuf=null, playing=false, recording=false, t0=0, raf=0, mr=null, chunks=[];

// ---------- muat fail (relatif dahulu, kemudian GitHub) ----------
async function getText(path){
  try{
    const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});
    if(r.ok){const t=await r.text(); if(t.trim() && !/^\s*<!doctype/i.test(t)) return t;}
  }catch(e){}
  const repo=$('repo').value.trim()||D.repo, br=$('branch').value.trim()||'main';
  const u='https://api.github.com/repos/'+repo+'/contents/'+path+'?ref='+encodeURIComponent(br)+'&_='+Date.now();
  const r=await fetch(u,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});
  if(!r.ok) throw new Error('GitHub '+r.status+' untuk '+path);
  return await r.text();
}

function runCode(code){
  return new Promise((res,rej)=>{
    window.VIDEO=null;
    const old=document.getElementById('vjs'); if(old) old.remove();
    const viaFn=()=>{try{(new Function(code))(); window.VIDEO?res(window.VIDEO):rej(new Error('Kod adegan tidak menetapkan VIDEO'))}catch(e){rej(e)}};
    try{
      const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
      const s=document.createElement('script'); s.id='vjs'; s.src=url;
      s.onload=()=>window.VIDEO?res(window.VIDEO):viaFn();
      s.onerror=viaFn;
      document.body.appendChild(s);
    }catch(e){viaFn()}
  });
}


// ---------- stempel masa ayat & penyelarasan babak ----------
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+(s<10?'0':'')+s.toFixed(1)};
function analyzeCues(){
  cues=null; cueLines=[];
  if(!abuf) return;
  const lines=$('script').value.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  if(!lines.length) return;
  const ch=abuf.getChannelData(0), win=Math.floor(abuf.sampleRate*.02), n=Math.floor(ch.length/win);
  const rms=new Float32Array(n); let mx=0;
  for(let i=0;i<n;i++){let s=0;for(let j=0;j<win;j++){const v=ch[i*win+j];s+=v*v}rms[i]=Math.sqrt(s/win);if(rms[i]>mx)mx=rms[i]}
  const thr=mx*.04, runs=[]; let st=-1, first=0, last=n;
  while(first<n&&rms[first]<thr) first++;
  while(last>first&&rms[last-1]<thr) last--;
  for(let i=first;i<=last;i++){
    const q=i<last&&rms[i]<thr;
    if(q&&st<0) st=i;
    if(!q&&st>=0){ const l=(i-st)*.02; if(l>=.09) runs.push({c:(st+i)/2*.02,e:i*.02,l}); st=-1 }
  }
  const t0v=first*.02, t1v=last*.02, span=t1v-t0v;
  const chars=lines.map(l=>l.length), tot=chars.reduce((x,y)=>x+y,0);
  const c=[t0v]; let acc=0;
  for(let k=0;k<lines.length-1;k++){
    acc+=chars[k]; const exp=t0v+acc/tot*span; let best=null,bs=-1e9;
    for(const r of runs){
      const d=Math.abs(r.c-exp);
      if(d<span*.12&&r.e>c[c.length-1]+.4){const sc=r.l-.2*d; if(sc>bs){bs=sc;best=r}}
    }
    c.push(best?best.e:exp);
  }
  c.push(t1v);
  cues=c; cueLines=lines;
  $('ts').value=lines.map((l,i)=>fmt(c[i])+'  '+l).join('\n')+'\n'+fmt(t1v)+'  (tamat suara)';
  $('tsw').style.display='block';
}
function sceneTime(el){
  if(!V) return 0;
  if(V.loop!==false) return el%V.duration;
  let t=el;
  if(abuf&&V.beats&&cues&&V.beats.length===cues.length){
    const B=V.beats,C=cues,e=C.length-1;
    if(el>=C[e]) t=B[e]+(el-C[e]);
    else if(el<C[0]) t=B[0]+(el-C[0]);
    else{ let i=0; while(i<e-1&&el>=C[i+1]) i++; t=B[i]+(el-C[i])/(C[i+1]-C[i])*(B[i+1]-B[i]) }
  }
  return Math.max(0,Math.min(t,V.duration));
}
$('cpts').onclick=async()=>{
  const ta=$('ts'),txt=ta.value;
  try{await navigator.clipboard.writeText(txt)}catch(e){ta.removeAttribute('readonly');ta.select();ta.setSelectionRange(0,99999);try{document.execCommand('copy')}catch(_){}ta.setAttribute('readonly','')}
  $('cpts').textContent='Disalin ✓';setTimeout(()=>$('cpts').textContent='Salin Stempel Masa',1500);
};

function frame(t){
  try{V.draw(ctx,t,cv.width,cv.height)}catch(e){st('Ralat adegan: '+e.message,1);playing=false}
}

async function loadAll(){
  try{
    st('Memuatkan adegan dan skrip...');
    stop();
    V=await runCode(await getText('video.js'));
    cv.width=V.width; cv.height=V.height; frame(0);
    try{ $('script').value=(await getText('skrip.txt')).trim(); }catch(e){}
    st('Siap dimuatkan: '+V.width+'×'+V.height+', adegan '+V.duration+' saat'+(V.loop===false?'.':' (berulang).'));
  }catch(e){st(e.message,1)}
}

// ---------- suara ----------
function b64ToBytes(b){const s=atob(b),n=s.length,a=new Uint8Array(n);for(let i=0;i<n;i++)a[i]=s.charCodeAt(i);return a}
function ensureAC(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac }

async function makeVoice(){
  const text=$('script').value.trim();
  if(!text) return st('Isi skrip suara dahulu',1);
  const key=$('gkey').value.trim(), model=$('tmodel').value.trim()||D.tmodel, vn=$('vname').value.trim()||D.vname, style=$('style').value.trim();
  $('voice').disabled=true;
  try{
    st('Menjana suara...');
    const body={contents:[{parts:[{text:(style?style+': ':'')+text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:vn}}}}};
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok) throw new Error('Suara '+r.status+': '+((j.error&&j.error.message)||''));
    const part=(((j.candidates||[])[0]||{}).content?.parts||[]).find(p=>p.inlineData);
    if(!part) throw new Error('Tiada audio dalam jawapan');
    const rate=+((/rate=(\d+)/.exec(part.inlineData.mimeType||'')||[])[1])||24000;
    const bytes=b64ToBytes(part.inlineData.data);
    const n=Math.floor(bytes.length/2), dv=new DataView(bytes.buffer);
    const a=ensureAC(); abuf=a.createBuffer(1,n,rate);
    const ch=abuf.getChannelData(0);
    for(let i=0;i<n;i++) ch[i]=dv.getInt16(i*2,true)/32768;
    analyzeCues(); st('Suara siap: '+abuf.duration.toFixed(1)+' saat'+(V&&V.beats&&cues&&V.beats.length===cues.length?', babak mengikut stempel masa':'')+'. Tekan Main atau Rakam & Simpan.');
  }catch(e){st(e.message,1)}
  finally{$('voice').disabled=false}
}

// ---------- main / rakam ----------
let src=null;
function startAudio(dest){
  if(!abuf) return;
  const a=ensureAC(); src=a.createBufferSource(); src.buffer=abuf;
  if(dest) src.connect(dest); else src.connect(a.destination);
  src.start();
}
function stop(){
  playing=false; recording=false; cancelAnimationFrame(raf);
  try{src&&src.stop()}catch(e){} src=null;
  $('play').textContent='Main';
}
function tick(now){
  if(!playing) return;
  const el=(now-t0)/1000;
  if(recording){
    const dur=abuf?abuf.duration+0.6:V.duration;
    if(el>=dur){ finishRec(); return; }
  }
  frame(sceneTime(el));
  raf=requestAnimationFrame(tick);
}
function play(){
  if(!V) return st('Muat adegan dahulu',1);
  if(playing&&!recording){stop();return}
  ensureAC(); analyzeCues(); playing=true; t0=performance.now(); startAudio(null);
  $('play').textContent='Henti'; raf=requestAnimationFrame(tick);
}
function pickMime(){
  const c=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
}
function startRec(){
  if(!V) return st('Muat adegan dahulu',1);
  if(recording) return;
  if(!window.MediaRecorder) return st('Pelayar tidak menyokong rakaman',1);
  stop();
  const a=ensureAC(), dest=a.createMediaStreamDestination();
  const vs=cv.captureStream(V.fps||30);
  const tracks=[...vs.getVideoTracks()]; if(abuf) tracks.push(...dest.stream.getAudioTracks());
  const mime=pickMime();
  mr=new MediaRecorder(new MediaStream(tracks), mime?{mimeType:mime,videoBitsPerSecond:8e6,audioBitsPerSecond:128000}:{videoBitsPerSecond:8e6});
  chunks=[];
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{
    const type=(mr.mimeType||mime||'video/webm').split(';')[0];
    const blob=new Blob(chunks,{type}), url=URL.createObjectURL(blob), ext=type.includes('mp4')?'mp4':'webm';
    const pv=$('pv'); pv.src=url; pv.style.display='block';
    const dl=$('dl'); dl.href=url; dl.download='video.'+ext; dl.style.display='block';
    dl.textContent='Muat Turun Video ('+ext.toUpperCase()+', '+(blob.size/1048576).toFixed(1)+' MB'+(abuf?', dengan suara':', tanpa suara')+')';
    st('Siap direkod.'); $('rec').disabled=false; $('play').disabled=false; $('voice').disabled=false;
  };
  analyzeCues(); recording=true; playing=true; t0=performance.now();
  $('rec').disabled=true; $('play').disabled=true; $('voice').disabled=true;
  st('Merekod'+(abuf?' dengan suara':' tanpa suara (jana suara dahulu jika mahu)')+'...');
  mr.start(250); startAudio(dest); raf=requestAnimationFrame(tick);
}
function finishRec(){
  frame(V.loop===false?V.duration:(abuf?abuf.duration:V.duration)%V.duration);
  recording=false; playing=false; $('play').textContent='Main';
  try{src&&src.stop()}catch(e){} src=null;
  setTimeout(()=>mr.stop(),200);
}

$('load').onclick=loadAll; $('voice').onclick=makeVoice; $('play').onclick=play; $('rec').onclick=startRec;
loadAll();
</script>
</body>
</html>
