<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suara Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1419;color:#e6e9ee;font-family:system-ui,sans-serif;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.w{width:min(100%,440px)}
h1{font-size:20px;margin:4px 0 0;text-align:center}
.row{display:flex;gap:8px}
button,.file{flex:1;padding:14px 8px;border:0;border-radius:10px;font-size:15px;font-weight:600;background:#2a3440;color:#e6e9ee;text-align:center;cursor:pointer}
button.p{background:#3b82f6;color:#fff}
button.g{background:#16a34a;color:#fff}
button:disabled{opacity:.45}
#st{font-size:13px;color:#9fb0c2;min-height:18px;text-align:center}
#st.err{color:#ff8a8a}
video{width:100%;max-height:60vh;border-radius:12px;background:#000;display:block}
label{display:block;font-size:12px;color:#9fb0c2;margin:8px 0 3px}
select,input[type=password],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #2f3b48;background:#10161c;color:#e6e9ee;font-size:15px;font-family:inherit}
textarea{min-height:74px;resize:vertical}
details{background:#1a2129;border:1px solid #2a3440;border-radius:12px;padding:10px}
summary{cursor:pointer;font-weight:600}
.seg{background:#1a2129;border:1px solid #2a3440;border-radius:12px;padding:10px;margin-bottom:8px}
.seg small{color:#9fb0c2}
a.dl{display:block;text-align:center;padding:14px;border-radius:10px;background:#16a34a;color:#fff;font-weight:600;text-decoration:none;margin-bottom:8px}
#bar{height:6px;background:#2a3440;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#3b82f6;transition:width .3s}
</style>
</head>
<body>
<h1>Suara Video</h1>

<div class="w">
  <label class="file" id="pick" style="display:block;position:relative;overflow:hidden">Pilih video<input id="file" type="file" accept="video/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0"></label>
</div>
<div class="w"><video id="vid" playsinline muted controls preload="auto"></video></div>

<div class="w row">
  <div style="flex:1"><label for="voice">Suara</label>
    <select id="voice">
      <option value="Kore" selected>Kore</option><option value="Puck">Puck</option><option value="Charon">Charon</option>
      <option value="Fenrir">Fenrir</option><option value="Aoede">Aoede</option><option value="Leda">Leda</option>
      <option value="Orus">Orus</option><option value="Zephyr">Zephyr</option><option value="Algieba">Algieba</option>
    </select></div>
  <div style="flex:1"><label for="tone">Gaya</label>
    <select id="tone">
      <option value="santai dan mesra" selected>Santai</option>
      <option value="bertenaga dan memotivasikan">Bertenaga</option>
      <option value="tenang dan jelas, seperti guru">Tenang</option>
      <option value="ceria seperti pengacara">Ceria</option>
    </select></div>
</div>

<div class="w"><button class="p" id="go" style="width:100%;font-size:17px">Jana suara</button></div>
<div class="w"><div id="bar"><i></i></div></div>
<div class="w" id="st"></div>

<div class="w" id="out" style="display:none">
  <div id="segs"></div>
  <div class="row" style="margin-bottom:8px">
    <button id="redo">Jana semula (teks diedit)</button>
  </div>
  <div class="row" style="margin-bottom:8px">
    <button class="p" id="play">Main dengan suara</button>
    <button id="stop">Henti</button>
  </div>
  <div class="row" style="margin-bottom:8px">
    <button class="g" id="savev">Simpan video bersuara</button>
    <button class="g" id="savew">Simpan suara (WAV)</button>
  </div>
  <div id="dls"></div>
</div>

<div class="w">
<details id="kd"><summary>Kunci API (pilihan)</summary>
  <label for="gkey">Kosongkan jika dalam Gemini Canvas. Kunci percuma: <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#7db3ff">aistudio.google.com/apikey</a></label>
  <input id="gkey" type="password" autocomplete="off">
</details>
</div>

<script>
const $=id=>document.getElementById(id);
const SR=24000, API='https://generativelanguage.googleapis.com/v1beta/models/';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let segs=[], pcm=[], cache=new Map(), actx=null, srcs=[], timers=[], busy=false;
try{$('gkey').value=localStorage.getItem('sv_key')||''}catch(e){}
$('gkey').addEventListener('input',()=>{try{localStorage.setItem('sv_key',$('gkey').value.trim())}catch(e){}});

function status(m,err){const s=$('st');s.textContent=m;s.className=err?'err':'';}
function prog(p){$('bar').firstChild.style.width=Math.round(p*100)+'%';}

function loadVideo(f){
  const v=$('vid');
  segs=[];pcm=[];$('out').style.display='none';prog(0);stopAll();
  status('Memuatkan video… '+(f.size/1048576).toFixed(1)+' MB');
  let done=false, tried=false;
  const ok=()=>{if(done)return;done=true;status('Video dimuat: '+f.name+' ('+(v.duration||0).toFixed(1)+' saat)');};
  const viaData=()=>{
    if(tried)return;tried=true;status('Cuba kaedah lain untuk muat video…');
    const fr=new FileReader();
    fr.onload=()=>{v.src=fr.result;v.load();};
    fr.onerror=()=>status('Video tak boleh dibaca. Cuba pilih semula.',true);
    fr.readAsDataURL(f);
  };
  v.onloadedmetadata=ok;
  v.onerror=()=>{
    if(!tried)viaData();
    else status('Video tak boleh dimainkan di sini (kod '+(v.error&&v.error.code)+'). Cuba video MP4 lain.',true);
  };
  try{v.src=URL.createObjectURL(f);v.load();}catch(e){viaData();}
  setTimeout(()=>{if(!done&&!tried&&v.readyState===0)viaData();},3500);
}
function onPick(e){const f=e.target.files&&e.target.files[0];if(f)loadVideo(f);}
$('file').addEventListener('change',onPick);
$('file').addEventListener('input',onPick);

const M={text:'',tts:'',redo:0,L:{text:[],tts:[]},ix:{text:0,tts:0}};
async function discover(){
  if(!$('gkey').value.trim()){
    M.L.text=['gemini-2.5-flash-preview-09-2025','gemini-2.5-flash','gemini-3.8-flash'];M.L.tts=['gemini-2.5-flash-preview-tts'];
    M.ix={text:0,tts:0};M.text=M.L.text[0];M.tts=M.L.tts[0];return;
  }
  try{
    const r=await fetch(API.slice(0,-1)+'?pageSize=200&key='+encodeURIComponent($('gkey').value.trim()));
    if(r.ok){
      const j=await r.json();
      const ms=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
      const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0;};
      const srt=a=>a.sort((x,y)=>ver(y)-ver(x));
      M.L.text=srt(ms.filter(n=>/^gemini-\d+(\.\d+)?-flash$/.test(n))).concat(srt(ms.filter(n=>/^gemini-\d+(\.\d+)?-flash-lite$/.test(n))));
      M.L.tts=srt(ms.filter(n=>/flash/.test(n)&&/tts/.test(n))).concat(srt(ms.filter(n=>/tts/.test(n)&&!/flash/.test(n))));
      const pref=M.L.tts.indexOf('gemini-2.5-flash-preview-tts');if(pref>0){M.L.tts.unshift(M.L.tts.splice(pref,1)[0]);}
      M.ix={text:0,tts:0};
      M.text=M.L.text[0]||'';M.tts=M.L.tts[0]||'';
    }
  }catch(e){}
  if(!M.text)M.text='gemini-3.8-flash';
  if(!M.tts)M.tts='gemini-2.5-flash-preview-tts';
}
async function gem(kind,bodyOrFn){
  if(!M[kind])await discover();
  for(let i=0;i<9;i++){
    const body=typeof bodyOrFn==='function'?bodyOrFn(M[kind]):bodyOrFn;
    const r=await fetch(API+M[kind]+':generateContent?key='+encodeURIComponent($('gkey').value.trim()),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok) return r.json();
    if(r.status===404&&!M.redo){M.redo=1;M.text='';M.tts='';await discover();continue;}
    let em={},m='';try{em=(await r.json()).error||{};m=em.message||''}catch(e){}
    if(r.status===429){
      let d=0;try{const ri=(em.details||[]).find(x=>/RetryInfo/.test(x['@type']||''));if(ri&&ri.retryDelay)d=Math.ceil(parseFloat(ri.retryDelay));}catch(e){}
      const daily=/per.?day|daily|limit:\s*0|billing|exceeded your current quota/i.test(m)&&(!d||d>90);
      if(daily||d>90||i>=8) throw new Error('Kuota Gemini habis (429). '+m.slice(0,220));
      const w=(d||25)+1;
      for(let q=w;q>0;q--){status('Had kadar Gemini penuh. Tunggu '+q+' saat, kemudian sambung sendiri…');await sleep(1000);}
      continue;
    }
    if(r.status>=500){
      if(i>=1&&M.L[kind]&&M.ix[kind]+1<M.L[kind].length){M.ix[kind]++;M[kind]=M.L[kind][M.ix[kind]];status('Model sibuk. Tukar ke '+M[kind]+'…');await sleep(1200);continue;}
      if(i>=7) throw new Error('Gemini sibuk (503). Cuba lagi sebentar lagi. '+m.slice(0,120));
      for(let q=6;q>0;q--){status('Gemini sibuk. Cuba semula dalam '+q+' saat…');await sleep(1000);}continue;
    }
    if([400,401,403,404].includes(r.status)&&!$('gkey').value.trim()&&M.L[kind]&&M.ix[kind]+1<M.L[kind].length){
      M.ix[kind]++;M[kind]=M.L[kind][M.ix[kind]];continue;
    }
    if((r.status===403||r.status===400||r.status===401)&&!$('gkey').value.trim()&&/api.?key|unregistered|credential|permission|not valid|forbidden/i.test(m)){
      $('kd').open=true;$('gkey').focus();
      throw new Error('Tiada kunci API. Ambil kunci percuma di aistudio.google.com/apikey, tampal dalam kotak Kunci API di bawah, kemudian tekan Jana suara semula.');
    }
    throw new Error('Gemini '+r.status+' ('+M[kind]+')'+(m?': '+m.slice(0,300):''));
  }
}

function seek(v,t){
  return new Promise(res=>{
    let done=false;const f=()=>{if(done)return;done=true;v.removeEventListener('seeked',f);res();};
    v.addEventListener('seeked',f);v.currentTime=t;setTimeout(f,2500);
  });
}
async function getFrames(){
  const v=$('vid'), d=v.duration;
  if(!d||!isFinite(d)) throw new Error('Video belum sedia. Tunggu sekejap dan cuba lagi.');
  const n=Math.min(12,Math.max(4,Math.round(d/2.5)));
  const sc=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight));
  const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
  const x=c.getContext('2d'), out=[];
  for(let i=0;i<n;i++){
    const t=Math.min(d-0.05,(i+0.5)*d/n);
    await seek(v,t);
    x.drawImage(v,0,0,c.width,c.height);
    out.push({t,b64:c.toDataURL('image/jpeg',0.72).split(',')[1]});
    prog(0.05+0.2*(i+1)/n);
  }
  await seek(v,0);
  return {frames:out,dur:d};
}

async function makeScript(frames,dur){
  const nseg=Math.min(5,Math.max(3,Math.round(dur/6)));
  const tone=$('tone').value;
  const intro='Kau penulis suara latar (voice-over) untuk video pendek menegak. Video ini '+dur.toFixed(1)+' saat. '+
  'Di bawah ialah bingkai-bingkai daripada video itu, setiap satu dengan cap masa. Fahami apa yang sebenarnya berlaku: visual, pergerakan, perubahan antara bingkai dan teks yang tertulis di skrin. '+
  'Tulis suara latar Bahasa Melayu Malaysia yang '+tone+', yang padan dengan apa yang sedang kelihatan pada masa itu. '+
  'Pecahkan kepada kira-kira '+nseg+' segmen berturutan mengikut perubahan adegan, bermula pada 0 dan tamat tidak lebih daripada '+dur.toFixed(1)+' saat. '+
  'Setiap segmen ada start, end (saat) dan text. Bilangan perkataan setiap segmen kira-kira (end - start) darab 2.2, supaya muat dalam masa itu. '+
  'Jangan reka apa-apa yang tak kelihatan. Jangan sebut perkataan "bingkai", "video" atau "skrin". Ayat pendek, senang dibaca kuat. Jawab JSON sahaja.';
  const parts=[{text:intro}];
  frames.forEach(f=>{parts.push({text:'Bingkai pada '+f.t.toFixed(1)+' saat:'});parts.push({inlineData:{mimeType:'image/jpeg',data:f.b64}});});
  const j=await gem('text',{contents:[{role:'user',parts}],generationConfig:{responseMimeType:'application/json',responseSchema:{type:'ARRAY',items:{type:'OBJECT',properties:{start:{type:'NUMBER'},end:{type:'NUMBER'},text:{type:'STRING'}},required:['start','end','text']}}}});
  const c0=(j.candidates||[])[0];const raw=((c0&&c0.content&&c0.content.parts)||[]).map(p=>p.text||'').join('');
  let a;try{a=JSON.parse(raw)}catch(e){throw new Error('Skrip tak dapat dibaca. Cuba tekan Jana suara sekali lagi.')}
  a=a.filter(s=>s&&typeof s.text==='string'&&s.text.trim()).map(s=>({start:Math.max(0,+s.start||0),end:Math.min(dur,Math.max(+s.end||0,(+s.start||0)+1)),text:s.text.trim()}));
  if(!a.length) throw new Error('Tiada skrip dijana. Cuba lagi.');
  a.sort((p,q)=>p.start-q.start);
  return a;
}

function trimSil(d,rate){
  const th=0.012; let a=0,b=d.length-1;
  while(a<b&&Math.abs(d[a])<th) a++;
  while(b>a&&Math.abs(d[b])<th) b--;
  a=Math.max(0,a-Math.floor(rate*.03)); b=Math.min(d.length-1,b+Math.floor(rate*.08));
  return d.subarray(a,b+1);
}
function splitBySilence(d,rate,texts){
  const win=Math.floor(rate*.02), n=Math.floor(d.length/win), rms=new Float32Array(n); let mx=0;
  for(let i=0;i<n;i++){let s=0;for(let j=0;j<win;j++){const v=d[i*win+j];s+=v*v}rms[i]=Math.sqrt(s/win);if(rms[i]>mx)mx=rms[i]}
  const thr=mx*.04, runs=[]; let st0=-1, first=0, last=n;
  while(first<n&&rms[first]<thr) first++;
  while(last>first&&rms[last-1]<thr) last--;
  for(let i=first;i<=last;i++){ const q=i<last&&rms[i]<thr;
    if(q&&st0<0) st0=i; if(!q&&st0>=0){ const l=(i-st0)*.02; if(l>=.12) runs.push({a:st0*.02,e:i*.02,c:(st0+i)/2*.02,l}); st0=-1 } }
  const t0=first*.02, t1=last*.02, span=t1-t0, chars=texts.map(t=>t.length), tot=chars.reduce((x,y)=>x+y,0);
  const b=[t0]; let acc=0;
  for(let k=0;k<texts.length-1;k++){
    acc+=chars[k]; const exp=t0+acc/tot*span; let best=null,bs=-1e9;
    for(const r of runs){ const dd=Math.abs(r.c-exp);
      if(dd<span*.15&&r.c>b[b.length-1]+.3){const sc=r.l*2-dd/span*3; if(sc>bs){bs=sc;best=r}} }
    b.push(best?best.c:exp);
  }
  b.push(t1);
  return texts.map((_,i)=>{ const a=Math.max(0,Math.floor(b[i]*rate)), e=Math.min(d.length,Math.ceil(b[i+1]*rate)); return trimSil(d.subarray(a,e),rate); });
}

const STYLE='Say in a clear, friendly narrator tone with a Malaysian Malay accent (Bahasa Melayu Malaysia, not Indonesian pronunciation)';
const clean=t=>t.replace(/\s+/g,' ').replace(/([^.!?…])$/,'$1.');
async function ttsText(joined){
  const voice=$('voice').value, tone=$('tone').value;
  const k=voice+'|'+tone+'|'+joined;
  if(cache.has(k)) return cache.get(k);
  let p=null,why='';
  for(let t=0;t<3&&!p;t++){
    const j=await gem('tts',mdl=>({contents:[{parts:[{text:STYLE+': '+joined}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}}));
    const c=(j.candidates||[])[0], parts=(c&&c.content&&c.content.parts)||[];
    p=parts.find(x=>x.inlineData);
    if(!p){
      why=(c&&c.finishReason)||(j.promptFeedback&&j.promptFeedback.blockReason)||'tiada audio';
      if(t>=1&&M.L.tts&&M.ix.tts+1<M.L.tts.length){M.ix.tts++;M.tts=M.L.tts[M.ix.tts];status('Suara kosong ('+why+'). Tukar ke '+M.tts+'…');}
      else status('Suara kosong ('+why+'). Cuba semula…');
      await sleep(1500);
    }
  }
  if(!p) throw new Error('Gemini tak pulangkan suara ('+why+'). Tekan Jana suara sekali lagi.');
  const bin=atob(p.inlineData.data), n=bin.length>>1, f=new Float32Array(n);
  for(let i=0;i<n;i++){let s=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(s>=32768)s-=65536;f[i]=s/32768;}
  cache.set(k,f);return f;
}
// Anggaran masa ucapan (saat) bagi teks Melayu: ~14 huruf sesaat
const expSec=t=>Math.max(0.6,t.length/14);
// Kuasa bunyi (RMS) purata audio — untuk kesan senyap
function loud(d){let s=0;for(let i=0;i<d.length;i++)s+=d[i]*d[i];return Math.sqrt(s/Math.max(1,d.length));}
// Semak satu segmen: terlalu pendek atau senyap = rosak
function badSeg(d,text){return !d||d.length<SR*expSec(text)*0.45||loud(d)<0.008;}

function renderSegs(){
  const box=$('segs');box.innerHTML='';
  // Satu kotak untuk semua teks (senang salin)
  const all=document.createElement('textarea');
  all.id='allt';all.style.minHeight='170px';all.value=segs.map(s=>s.text).join('\n\n');
  const lab=document.createElement('label');lab.textContent='Semua teks suara (pisah segmen dengan baris kosong)';
  const cp=document.createElement('button');cp.className='g';cp.style.cssText='width:100%;margin:8px 0';cp.textContent='Salin semua teks';
  cp.onclick=async()=>{
    all.select();
    try{await navigator.clipboard.writeText(all.value);}catch(e){try{document.execCommand('copy');}catch(e2){}}
    status('Teks disalin.');
  };
  box.appendChild(lab);box.appendChild(all);box.appendChild(cp);
  // Segmen berasingan (dengan masa), dalam bahagian boleh buka
  const det=document.createElement('details');det.style.marginBottom='8px';
  const sum=document.createElement('summary');sum.textContent='Segmen mengikut masa';det.appendChild(sum);
  const tas=[];
  segs.forEach((s,i)=>{
    const d=document.createElement('div');d.className='seg';d.style.marginTop='8px';
    const sm=document.createElement('small');sm.textContent=s.start.toFixed(1)+'s – '+s.end.toFixed(1)+'s';
    const ta=document.createElement('textarea');ta.value=s.text;tas.push(ta);
    ta.addEventListener('input',()=>{segs[i].text=ta.value;all.value=segs.map(x=>x.text).join('\n\n');});
    d.appendChild(sm);d.appendChild(ta);det.appendChild(d);
  });
  box.appendChild(det);
  all.addEventListener('input',()=>{
    const parts=all.value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    if(parts.length===segs.length){parts.forEach((t,i)=>{segs[i].text=t;tas[i].value=t;});}
  });
  $('out').style.display='block';
}

async function makeAudio(){
  status('Menjana suara (sekali jalan supaya nada sekata)…');prog(0.4);
  const texts=segs.map(s=>clean(s.text));
  const full=await ttsText(texts.join('\n\n'));
  prog(0.7);
  const expTotal=texts.reduce((a,t)=>a+expSec(t),0);
  const truncated=full.length/SR<expTotal*0.6;
  pcm=segs.length>1&&!truncated?splitBySilence(full,SR,texts):(segs.length>1?[]:[trimSil(full,SR)]);
  // Segmen yang hilang/senyap/terpotong dijana semula satu per satu
  const need=[];
  for(let i=0;i<segs.length;i++) if(truncated||badSeg(pcm[i],texts[i])) need.push(i);
  for(let q=0;q<need.length;q++){
    const i=need[q];
    status('Suara terpotong. Membaiki segmen '+(i+1)+' ('+(q+1)+'/'+need.length+')…');
    await sleep(q?900:0);
    let d=trimSil(await ttsText(texts[i]),SR);
    if(badSeg(d,texts[i])){
      cache.delete($('voice').value+'|'+$('tone').value+'|'+texts[i]);
      await sleep(1200);
      d=trimSil(await ttsText(texts[i]),SR);
    }
    pcm[i]=d;
    prog(0.7+0.3*(q+1)/need.length);
  }
  prog(1);
}

function plan(){
  let t=0;
  return segs.map((s,i)=>{
    const len=pcm[i].length/SR, slot=Math.max(0.5,s.end-s.start);
    const rate=Math.min(1.25,Math.max(1,len/slot));
    const dur=len/rate, st=Math.max(s.start,t);
    t=st+dur+0.12;
    return {st,dur,rate};
  });
}
function totalLen(pl){return pl.length?Math.max($('vid').duration||0,pl[pl.length-1].st+pl[pl.length-1].dur):0;}

$('go').addEventListener('click',async()=>{
  if(busy)return;
  if(!$('vid').src){status('Pilih video dulu.',true);return;}
  busy=true;$('go').disabled=true;stopAll();
  try{
    ac();
    status('Membaca video…');prog(0.02);
    const {frames,dur}=await getFrames();
    status('Memahami video dan menulis suara…');
    segs=await makeScript(frames,dur);prog(0.3);
    renderSegs();
    await makeAudio();
    const pl=plan(),tl=totalLen(pl);
    status('Siap. Suara '+segs.length+' segmen, '+tl.toFixed(1)+' saat.');prog(1);
  }catch(e){status(e.message||String(e),true);}
  busy=false;$('go').disabled=false;
});

$('redo').addEventListener('click',async()=>{
  if(busy||!segs.length)return;
  busy=true;$('redo').disabled=true;stopAll();
  try{ac();await makeAudio();status('Siap. Suara dijana semula.');prog(1);}
  catch(e){status(e.message||String(e),true);}
  busy=false;$('redo').disabled=false;
});

function ac(){
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function stopAll(){
  srcs.forEach(s=>{try{s.stop()}catch(e){}});srcs=[];
  timers.forEach(clearTimeout);timers=[];
  try{$('vid').pause()}catch(e){}
}
$('stop').addEventListener('click',()=>{stopAll();status('Dihentikan.');});

// Campur semua segmen jadi SATU trek (dengan fade halus di hujung segmen supaya tak "klik"/putus)
function mixTrack(rate){
  const pl=plan(), tl=totalLen(pl), n=Math.ceil((tl+0.3)*rate), mix=new Float32Array(n), k=rate/SR;
  const fade=Math.floor(rate*0.012);
  pl.forEach((p,i)=>{
    const src=pcm[i], o=Math.floor(p.st*rate), m=Math.floor((src.length/p.rate)*k);
    for(let j=0;j<m&&o+j<n;j++){
      const q=j*p.rate/k, a=Math.floor(q); if(a+1>=src.length)break;
      const fr=q-a; let v=src[a]*(1-fr)+src[a+1]*fr;
      if(j<fade)v*=j/fade; else if(m-j<fade)v*=(m-j)/fade;
      mix[o+j]+=v;
    }
  });
  return {mix,tl};
}
function startPlayback(record){
  const ctx=ac(), v=$('vid');
  const {mix,tl}=mixTrack(ctx.sampleRate);
  const dest=record?ctx.createMediaStreamDestination():null;
  stopAll();
  const lead=0.4, t0=ctx.currentTime+lead;
  const b=ctx.createBuffer(1,mix.length,ctx.sampleRate);b.copyToChannel(mix,0);
  const s=ctx.createBufferSource();s.buffer=b;
  s.connect(ctx.destination);if(dest)s.connect(dest);
  s.start(t0);srcs.push(s);
  v.muted=true;
  const startVideo=()=>{v.currentTime=0;v.play().catch(()=>{});};
  return {dest,tl,lead,startVideo,v};
}

$('play').addEventListener('click',()=>{
  if(!pcm.length||pcm.length!==segs.length){status('Jana suara dulu.',true);return;}
  const r=startPlayback(false);
  timers.push(setTimeout(r.startVideo,r.lead*1000));
  timers.push(setTimeout(()=>{status('Selesai main.');},(r.lead+r.tl+0.3)*1000));
  status('Sedang main…');
});

function showLink(blob,name,label){
  const url=URL.createObjectURL(blob), mb=(blob.size/1048576).toFixed(1)+' MB';
  const wrap=document.createElement('div');wrap.style.marginBottom='12px';
  const a=document.createElement('a');a.href=url;a.download=name;a.className='dl';a.textContent=label+' ('+mb+')';
  wrap.appendChild(a);
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
    const sb=document.createElement('button');sb.className='p';sb.style.cssText='width:100%;margin-bottom:8px';sb.textContent='Kongsi / simpan ke telefon';
    sb.onclick=async()=>{try{await navigator.share({files:[file],title:name});}catch(e){if(e&&e.name!=='AbortError')status('Kongsi tak berjaya: '+(e.message||e),true);}};
    wrap.appendChild(sb);
  }
  const pv=document.createElement(blob.type.startsWith('video')?'video':'audio');
  pv.src=url;pv.controls=true;pv.playsInline=true;pv.style.cssText='width:100%;border-radius:12px;background:#000';
  wrap.appendChild(pv);
  const tip=document.createElement('small');tip.style.cssText='display:block;color:#9fb0c2;margin-top:4px';
  tip.textContent='Kalau butang hijau tak boleh simpan, tekan menu ⋮ pada pemain di atas dan pilih Muat turun, atau guna Kongsi.';
  wrap.appendChild(tip);
  const box=$('dls');box.insertBefore(wrap,box.firstChild);
  try{a.click();}catch(e){}
}

$('savev').addEventListener('click',()=>{
  if(!pcm.length||pcm.length!==segs.length){status('Jana suara dulu.',true);return;}
  const v=$('vid');
  if(!v.captureStream||!window.MediaRecorder){status('Pelayar ini tak boleh rakam video. Guna Simpan suara (WAV) dan gabung dalam CapCut.',true);return;}
  const r=startPlayback(true);
  const stream=new MediaStream([...v.captureStream().getVideoTracks(),...r.dest.stream.getAudioTracks()]);
  const mimes=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:{});
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{
    const type=(rec.mimeType||mime||'video/webm').split(';')[0];
    const blob=new Blob(chunks,{type});
    showLink(blob,'video-bersuara.'+(type.includes('mp4')?'mp4':'webm'),'Simpan video bersuara');
    status('Video bersuara siap. Tekan butang hijau untuk simpan.');
  };
  rec.start(500);
  timers.push(setTimeout(r.startVideo,r.lead*1000));
  timers.push(setTimeout(()=>{if(rec.state!=='inactive')rec.stop();stopAll();},(r.lead+r.tl+0.6)*1000));
  status('Merakam video bersuara… tunggu sampai habis ('+Math.round(r.tl)+' saat).');
});

function wavBlob(){
  const {mix}=mixTrack(SR), n=mix.length;
  const buf=new ArrayBuffer(44+n*2), dv=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');dv.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,mix[i]));dv.setInt16(44+i*2,s<0?s*32768:s*32767,true);}
  return new Blob([buf],{type:'audio/wav'});
}
$('savew').addEventListener('click',()=>{
  if(!pcm.length||pcm.length!==segs.length){status('Jana suara dulu.',true);return;}
  showLink(wavBlob(),'suara-video.wav','Simpan suara (WAV)');
  status('Suara siap. Tekan butang hijau untuk simpan.');
});
</script>
